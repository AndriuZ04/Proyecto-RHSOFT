{% extends 'base.html' %}

{% block title %}Nuevo Cargo{% endblock %}

{% block content %}

<div class="flex min-h-screen">

    {% include 'partials/sidebar_admin.html' %}

    <main class="flex-1 p-8 bg-slate-50">

        <div class="flex justify-between items-center mb-8">
            <div>
                <p class="text-xs text-slate-400 mb-1">Gestión de personal › Cargos</p>
                <h1 class="text-3xl font-bold text-blue-900">Nuevo Cargo</h1>
            </div>
            <a href="/cargos"
               class="text-sm text-slate-500 border border-slate-200 bg-white px-4 py-2 rounded-xl hover:bg-slate-50 transition">
                ← Volver
            </a>
        </div>

        <div class="bg-white border border-slate-200 rounded-2xl p-8 max-w-2xl">

            <form method="POST" action="/guardar_cargo">

                <div class="grid md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">
                            Nombre del cargo
                        </label>
                        <input
                            type="text"
                            name="nombre"
                            placeholder="Ej: Analista RRHH"
                            class="border border-slate-200 rounded-xl px-4 py-3 w-full text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400 bg-slate-50"
                            required>
                        <p id="error-nombre" style="display:none; color:#ef4444; font-size:12px; margin-top:4px;">
                            ⚠ Solo se permiten letras y espacios.
                        </p>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">
                            Salario de referencia
                        </label>
                        <input
                            type="number"
                            name="salario"
                            placeholder="Ej: 2500000"
                            class="border border-slate-200 rounded-xl px-4 py-3 w-full text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400 bg-slate-50"
                            required>
                    </div>
                </div>

                <div class="mt-5">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">
                        Descripción
                    </label>
                    <textarea
                        name="descripcion"
                        rows="4"
                        placeholder="Describe las funciones del cargo..."
                        class="border border-slate-200 rounded-xl px-4 py-3 w-full text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400 bg-slate-50 resize-none"
                        required></textarea>
                </div>

                <div class="mt-6 flex gap-3">
                    <button
                        type="submit"
                        class="bg-blue-900 text-white px-6 py-3 rounded-xl text-sm font-semibold hover:bg-blue-800 transition w-full">
                        Guardar Cargo
                    </button>
                    <a href="/cargos"
                       class="text-sm text-slate-500 border border-slate-200 px-6 py-3 rounded-xl hover:bg-slate-50 transition text-center whitespace-nowrap">
                        Cancelar
                    </a>
                </div>

            </form>
        </div>

    </main>
</div>

<script>
document.querySelector('input[name="nombre"]').addEventListener('input', function () {
    const soloTexto = /^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]*$/;
    const mensaje = document.getElementById('error-nombre');
    if (!soloTexto.test(this.value)) {
        this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '');
        mensaje.style.display = 'block';
    } else {
        mensaje.style.display = 'none';
    }
});
</script>

{% endblock %}
