{% extends 'base.html' %}

{% block title %}
Nueva Vacación
{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto mt-10 bg-white p-8 rounded-xl shadow">

    <h1 class="text-3xl font-bold text-blue-900 mb-6">
        Nueva Solicitud de Vacaciones
    </h1>

    <form
        action="/guardar_vacacion"
        method="POST">

        <div class="mb-4">

            <label class="font-bold">
                Empleado
            </label>

            <select
                name="id_empleado"
                class="w-full border rounded p-3 mt-2">

                {% for empleado in empleados %}

                <option value="{{ empleado[0] }}">
                    {{ empleado[1] }}
                </option>

                {% endfor %}

            </select>

        </div>

        <div class="mb-4">

            <label class="font-bold">
                Fecha Inicio
            </label>

            <input
                type="date"
                name="fecha_inicio"
                required
                class="w-full border rounded p-3 mt-2">

        </div>

        <div class="mb-4">

            <label class="font-bold">
                Fecha Fin
            </label>

            <input
                type="date"
                name="fecha_fin"
                required
                class="w-full border rounded p-3 mt-2">

        </div>

        <div class="mb-4">

            <label class="font-bold">
                Días
            </label>

            <input
                type="number"
                name="dias"
                required
                class="w-full border rounded p-3 mt-2">

        </div>

        <div class="mb-6">

            <label class="font-bold">
                Estado
            </label>

            <select
                name="estado"
                class="w-full border rounded p-3 mt-2">

                <option value="PENDIENTE">
                    PENDIENTE
                </option>

                <option value="APROBADA">
                    APROBADA
                </option>

                <option value="RECHAZADA">
                    RECHAZADA
                </option>

            </select>

        </div>

        <button
            type="submit"
            class="bg-green-600 text-white px-6 py-3 rounded">

            Guardar Vacación

        </button>

    </form>

</div>

{% endblock %}
