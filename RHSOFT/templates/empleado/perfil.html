{% extends 'base.html' %}

{% block title %}
Mi Perfil
{% endblock %}

{% block content %}

<div class="flex min-h-screen">

    {% include 'partials/sidebar_empleado.html' %}

    <main class="flex-1 p-8">

        <h1 class="text-4xl font-bold text-blue-900 mb-8">
            Mi Perfil
        </h1>

        <div class="grid md:grid-cols-2 gap-6">

    <div>
        <label class="font-bold">Nombre</label>
        <input
            value="{{ empleado[0] }}"
            readonly
            class="w-full border p-3 rounded mt-2">
    </div>

    <div>
        <label class="font-bold">Correo</label>
        <input
            value="{{ empleado[1] }}"
            readonly
            class="w-full border p-3 rounded mt-2">
    </div>

    <div>
        <label class="font-bold">Cargo</label>
        <input
            value="{{ empleado[2] }}"
            readonly
            class="w-full border p-3 rounded mt-2">
    </div>

    <div>
        <label class="font-bold">Departamento</label>
        <input
            value="{{ empleado[3] }}"
            readonly
            class="w-full border p-3 rounded mt-2">
    </div>

    <div>
        <label class="font-bold">Documento</label>
        <input
            value="{{ empleado[4] }}"
            readonly
            class="w-full border p-3 rounded mt-2">
    </div>

    <div>
        <label class="font-bold">Fecha Ingreso</label>
        <input
            value="{{ empleado[5] }}"
            readonly
            class="w-full border p-3 rounded mt-2">
    </div>

    <div>
        <label class="font-bold">Estado</label>
        <input
            value="{{ empleado[6] }}"
            readonly
            class="w-full border p-3 rounded mt-2">
    </div>

</div>

{% endblock %}
